services:
  redis:
    image: redis:7-alpine
    container_name: vulture_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: vulture_backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - VULTURE_DB_PATH=/app/data/vulture.db
    volumes:
      - vulture_data:/app/data
    depends_on:
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: vulture_worker
    command: celery -A backend.worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - VULTURE_DB_PATH=/app/data/vulture.db
    volumes:
      - vulture_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: vulture_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vulture_data:
